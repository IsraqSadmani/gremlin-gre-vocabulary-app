<html lang="en">
<head>

<meta name="description" content="Flashcards, synonym recall and quizzes for Gremlin's GRE Vocabulary Lists 1-15.">
<meta name="theme-color" content="#2F4FC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10142A" media="(prefers-color-scheme: dark)">

@font-face{font-family:"Young Serif";src:url(fonts/young-serif-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(fonts/atkinson-hyperlegible-latin-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one narrow study column; an index-card flashcard is the centrepiece, everything else is quiet chrome around it. */
:root{
  --paper:#F3F5FA; --card:#FFFFFF; --ink:#18203A; --muted:#5B6480; --line:#DCE1EC;
  --accent:#2F4FC9; --accent-ink:#FFFFFF; --hl:#FFD95C; --hl-ink:#3A2E00;
  --good:#1F8A5B; --good-bg:#E2F4EA; --bad:#C2413A; --bad-bg:#FBE6E4; --warn:#A86A00;
  --chip:#EAEEF7; --rule:#E4E9F4;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10142A; --card:#1A2040; --ink:#E7EAF6; --muted:#9AA3C4; --line:#2B3360;
  --accent:#8EA6FF; --accent-ink:#0E1330; --hl:#E8C24A; --hl-ink:#251C00;
  --good:#5CD39A; --good-bg:#14352A; --bad:#FF8A80; --bad-bg:#3D1C22; --warn:#F2B84B;
  --chip:#252C55; --rule:#242B54; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#10142A; --card:#1A2040; --ink:#E7EAF6; --muted:#9AA3C4; --line:#2B3360;
  --accent:#8EA6FF; --accent-ink:#0E1330; --hl:#E8C24A; --hl-ink:#251C00;
  --good:#5CD39A; --good-bg:#14352A; --bad:#FF8A80; --bad-bg:#3D1C22; --warn:#F2B84B;
  --chip:#252C55; --rule:#242B54; color-scheme:dark }
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 40px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top h1{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin:0;flex:1;min-width:0;text-wrap:balance}
.back{border:0;background:var(--chip);border-radius:999px;padding:8px 14px;font-weight:700}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.3rem;font-weight:500}
.stat span{font-size:.78rem;color:var(--muted)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.lt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px 10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.lt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.lt .t{font-weight:700;font-size:.9rem}
.lt .c{font-size:.72rem;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--rule);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--good)} .bar .l{background:var(--hl)}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px 16px;text-align:left}
.mode .ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-family:var(--f-display);font-size:1.2rem;color:var(--accent)}
.mode .tx{flex:1;min-width:0}
.mode .tx strong{display:block;font-size:1rem}
.mode .tx small{color:var(--muted);font-size:.85rem}
.mode.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mode.primary .ic{background:rgba(255,255,255,.18);color:var(--accent-ink)}
.mode.primary small{color:inherit;opacity:.85}
.prog{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.prog .bar{flex:1;height:6px}
.prog .bar .f{background:var(--accent)}
/* index card */
.icard{background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(20,30,70,.35);
  background-image:linear-gradient(var(--card) 0 0),repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  background-size:100% 56px,100% 100%;background-repeat:no-repeat,repeat;padding:18px 18px 22px;display:flex;flex-direction:column;gap:14px;position:relative}
.icard::before{content:"";position:absolute;left:0;right:0;top:56px;height:2px;background:var(--bad);opacity:.45}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);min-height:20px}
.head{font-family:var(--f-display);font-size:clamp(2rem,9vw,2.8rem);line-height:1.1;margin:22px 0 6px;overflow-wrap:anywhere;text-wrap:balance}
.head mark{background:linear-gradient(transparent 58%, var(--hl) 58% 92%, transparent 92%);color:inherit;padding:0 .08em}
.defs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:1.05rem}
.syns{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:4px 11px;font-size:.92rem;border:1px solid transparent}
.chip.hit{background:var(--good-bg);color:var(--good);border-color:var(--good);font-weight:700}
.chip.miss{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.chip.extra{background:var(--bad-bg);color:var(--bad)}
.chip.link{border:0;cursor:pointer}
.plus{font-size:.88rem;color:var(--muted);font-style:italic}
.ex{border-left:3px solid var(--hl);padding-left:12px;margin:0;font-style:italic;color:var(--ink)}
.ex p{margin:0 0 4px}
.reveal{border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:14px;font-weight:700;font-size:1rem}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}
.grades small{font-weight:400;color:var(--muted);font-size:.75rem}
.grades .g0{color:var(--bad)} .grades .g3{color:var(--good)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 16px;text-align:left;font-size:1.05rem;display:flex;gap:12px;align-items:center}
.opt .k{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);width:1.2em}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.q{font-family:var(--f-display);font-size:1.6rem;margin:6px 0 0;overflow-wrap:anywhere}
.qhint{color:var(--muted);margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-weight:700}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.grow{flex:1}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.search{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);box-sizing:border-box}
.entries{display:flex;flex-direction:column;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.entry{border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry summary{list-style:none;display:flex;align-items:baseline;gap:10px;padding:12px 14px;cursor:pointer}
.entry summary::-webkit-details-marker{display:none}
.entry summary .w{font-family:var(--f-display);font-size:1.1rem;flex:none}
.entry summary .d{color:var(--muted);font-size:.88rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.st{width:9px;height:9px;border-radius:50%;flex:none;align-self:center;background:var(--rule);border:1px solid var(--line)}
.st.learn{background:var(--hl);border-color:var(--hl)} .st.master{background:var(--good);border-color:var(--good)} .st.weak{background:var(--bad);border-color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:20px 0}
.done .big{font-family:var(--f-display);font-size:3rem;line-height:1}
.missed{width:100%;text-align:left}
.note{font-size:.8rem;color:var(--muted);margin:0}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:700;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.empty{color:var(--muted);text-align:center;padding:16px}
@media (prefers-reduced-motion:no-preference){.icard,.opt{transition:transform .15s ease, background-color .15s}.flip{animation:fl .22s ease}@keyframes fl{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>

}
function merge(other){
  for(const k in other){ const a=P[k], b=other[k]; if(!a || (b.t||0)>(a.t||0)) P[k]=b; }
}
function setSync(s){ syncState=s; const el=document.getElementById("sync"); if(el) el.innerHTML=syncHTML(); }
function syncHTML(){ return syncState==="cloud" ? '<span class="dot on"></span>Synced to your account' : '<span class="dot"></span>Saved on this device'; }
(async ()=>{
  try{
    if(!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    const ref = db.doc("data/users/"+uid+"/progress");
    const snap = await ref.get();
    if(snap.exists){ const d=snap.data(); if(d && d.p) merge(d.p); }
    remote = ref; setSync("cloud");
    saveLocal();
    if(Object.keys(P).length) save();
    if(view==="home") render();
  }catch(e){ setSync("local"); }
})();

function rec(id){ return P[id] || null; }
function status(id){
  const r=P[id]; if(!r) return "new";
  if(r.b>=4) return "master";
  if(r.w>r.r && r.b<2) return "weak";
  return "learn";
}
function grade(id, g){ // g: 0 again,1 hard,2 good,3 easy
  const now=Date.now(); const r=P[id]||{b:0,due:0,r:0,w:0};
  if(g===0){ r.b=0; r.w++; r.due=now; }
  else{ r.r++; r.b = g===1 ? Math.max(1,r.b) : Math.min(INTERVALS.length-1, r.b + (g===3?2:1)); r.due = now + INTERVALS[r.b]*DAY; }
  r.t=now; P[id]=r; save();
}
function quizMark(id, ok){
  const now=Date.now(); const r=P[id]||{b:0,due:0,r:0,w:0};
  if(ok){ r.r++; if(r.b===0){ r.b=1; r.due=now+DAY; } }
  else { r.w++; r.b=0; r.due=now; }
  r.t=now; P[id]=r; save();
}
function nextLabel(id,g){
  const r=P[id]||{b:0}; if(g===0) return "now";
  const b = g===1 ? Math.max(1,r.b) : Math.min(INTERVALS.length-1, r.b+(g===3?2:1));
  const d=INTERVALS[b]; return d<1?"now":d+"d";
}
function scope(){ return ui.list ? V.filter(o=>o.l===ui.list) : V; }
function counts(words){
  const now=Date.now(); let m=0,l=0,n=0,due=0;
  for(const o of words){ const r=P[o.id]; if(!r) n++; else { if(r.b>=4) m++; else l++; if(r.due<=now) due++; } }
  return {m,l,n,due,total:words.length};
}

/* ---------- views ---------- */
let view="home", S=null;
function go(v, state){ view=v; S=state||null; render(); window.scrollTo(0,0); }
function top(title, back=true){
  return `<div class="top">${back?'<button class="back" data-a="home" aria-label="Back to home">← Home</button>':""}<h1>${title}</h1><div class="sync" id="sync">${syncHTML()}</div></div>`;
}
function render(){
  ({home,flash,quiz,recall,browse})[view]();
}

function home(){
  const sc=scope(), c=counts(sc), all=counts(V);
  const scopeName = ui.list ? "List "+ui.list : "All 15 lists";
  const flashSub = ui.list ? `${c.due} due · ${c.n} new · ${c.m} mastered` : `${c.due} due · ${c.n} new (${NEW_PER_SESSION} per session) · ${c.m} mastered`;
  let tiles = `<button class="lt" data-list="0" aria-pressed="${ui.list===0}"><span class="t">All lists</span><span class="c num">${all.m}/${all.total} mastered</span><span class="bar"><i class="m" style="width:${all.m/all.total*100}%"></i><i class="l" style="width:${all.l/all.total*100}%"></i></span></button>`;
  for(const L of LISTS){
    const w=V.filter(o=>o.l===L), k=counts(w);
    tiles += `<button class="lt" data-list="${L}" aria-pressed="${ui.list===L}"><span class="t">List ${L}</span><span class="c num">${k.m}/${k.total}${k.due?` · ${k.due} due`:""}</span><span class="bar"><i class="m" style="width:${k.m/k.total*100}%"></i><i class="l" style="width:${k.l/k.total*100}%"></i></span></button>`;
  }
  app.innerHTML = `${top("Gremlin Vocab Trainer", false)}
  <div class="summary">
    <div class="stat"><b>${all.m}</b><span>mastered of ${all.total}</span></div>
    <div class="stat"><b>${all.l}</b><span>learning</span></div>
    <div class="stat"><b>${all.due}</b><span>due for review</span></div>
  </div>
  <section style="display:flex;flex-direction:column;gap:10px">
    <p class="label">Study scope</p>
    <div class="lists">${tiles}</div>
    <div class="legend"><span><i class="st master"></i>Mastered</span><span><i class="st learn"></i>Learning</span><span><i class="st"></i>New</span></div>
  </section>
  <section style="display:flex;flex-direction:column;gap:10px">
    <p class="label">${esc(scopeName)} · ${c.total} words</p>
    <div class="modes">
      <button class="mode primary" data-a="flash"><span class="ic">◧</span><span class="tx"><strong>Flashcards</strong><small>${flashSub}</small></span></button>
      <button class="mode" data-a="recall"><span class="ic">✎</span><span class="tx"><strong>Recall the synonyms</strong><small>Type every pair word you remember, see what you missed</small></span></button>
      <button class="mode" data-a="quiz"><span class="ic">?</span><span class="tx"><strong>Synonym checkpoint</strong><small>20 multiple-choice questions, like the book's tests</small></span></button>
      <button class="mode" data-a="browse"><span class="ic">≡</span><span class="tx"><strong>Word list</strong><small>Search every word, definition and synonym</small></span></button>
    </div>
  </section>
  <details class="entries"><summary style="padding:12px 14px;cursor:pointer;font-weight:700">Move progress to another device</summary>
    <div style="padding:0 14px 14px;display:flex;flex-direction:column;gap:10px">
      <p class="note">Copy this code on one device and paste it on the other. Pasting merges the two, keeping the newest result for each word.</p>
      <textarea id="bk-out" readonly rows="3" class="search" style="font-family:var(--f-mono);font-size:.75rem">${esc(btoa(unescape(encodeURIComponent(JSON.stringify(P)))))}</textarea>
      <div class="row"><button class="btn" data-a="bk-copy">Copy code</button></div>
      <textarea id="bk-in" rows="3" class="search" placeholder="Paste a progress code here" style="font-family:var(--f-mono);font-size:.75rem"></textarea>
      <div class="row"><button class="btn pri" data-a="bk-load">Load pasted code</button><span class="note" id="bk-msg" style="align-self:center"></span></div>
    </div></details>
  <p class="note">Content from Gremlin's GRE Vocabulary, Complete Edition (Lists 1–15). Words marked * are marked the same way in the book.</p>`;
}

/* Flashcards */
function startFlash(){
  const now=Date.now(), sc=scope();
  const due = shuffle(sc.filter(o=>P[o.id] && P[o.id].due<=now)).sort((a,b)=>P[a.id].b-P[b.id].b);
  const fresh = sc.filter(o=>!P[o.id]).slice(0, ui.list ? sc.length : NEW_PER_SESSION);
  const q = due.concat(fresh).map(o=>o.id);
  return {q, i:0, shown:false, done:0, total:q.length};
}
function cardBack(o, chipsHTML){
  return `<ul class="defs">${o.d.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>
    <div style="display:flex;flex-direction:column;gap:8px"><p class="label">Pair words / synonyms · ${o.s.length}</p>
    <div class="syns">${chipsHTML || o.s.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div>
    ${o.p?`<p class="plus">${esc(o.p)}</p>`:""}</div>
    <blockquote class="ex">${o.x.map(x=>`<p>${esc(x)}</p>`).join("")}</blockquote>`;
}
function flash(){
  if(!S) S=startFlash();
  if(S.i>=S.q.length){
    const c=counts(scope());
    app.innerHTML = `${top("Flashcards")}<div class="done"><div class="big">${S.total?"Done":"All caught up"}</div>
      <p>${S.total?`You reviewed ${S.done} cards.`:"Nothing is due in this scope right now."} ${c.n?`${c.n} new words left here.`:""}</p>
      <div class="row">${c.n||c.due?'<button class="btn pri" data-a="flash-again">Study more</button>':""}<button class="btn" data-a="home">Home</button></div></div>`;
    return;
  }
  const o=BY[S.q[S.i]], r=rec(o.id);
  const tag = !r ? "New" : (r.b>=4?"Mastered":"Box "+r.b);
  app.innerHTML = `${top("Flashcards")}
  <div class="prog"><span class="num">${S.i+1}/${S.q.length}</span><span class="bar"><i class="f" style="width:${S.i/S.q.length*100}%"></i></span></div>
  <article class="icard flip">
    <div class="meta"><span>List ${o.l} · word ${o.n}</span><span>${tag}</span></div>
    <h2 class="head"><mark>${esc(disp(o.w))}</mark>${o.w.includes("*")?"*":""}</h2>
    ${S.shown ? cardBack(o) : `<p class="qhint">Say the meaning and as many synonyms as you can, then check.</p>`}
  </article>
  ${S.shown ? `<div class="grades">
     <button class="g0" data-g="0">Again<small>${nextLabel(o.id,0)}</small></button>
     <button data-g="1">Hard<small>${nextLabel(o.id,1)}</small></button>
     <button data-g="2">Good<small>${nextLabel(o.id,2)}</small></button>
     <button class="g3" data-g="3">Easy<small>${nextLabel(o.id,3)}</small></button></div>`
   : `<button class="reveal" data-a="show">Show answer</button>`}`;
}

/* Quiz */
function startQuiz(){
  const sc=scope(); const pool = sc.length>=8 ? sc : V;
  const qs=[];
  for(const o of pick(sc, Math.min(20, sc.length))){
    const set=new Set(o.s.map(norm));
    const related = w => w.id===o.id || set.has(norm(w.w)) || w.s.some(s=>set.has(norm(s)));
    if(Math.random()<0.6){
      const ans = pick(o.s,1)[0];
      const cands = [...new Set(pool.filter(w=>!related(w)).flatMap(w=>w.s))].filter(s=>!set.has(norm(s)) && norm(s)!==norm(o.w));
      qs.push({id:o.id, type:"w2s", prompt:disp(o.w), ans, opts:shuffle([ans,...pick(cands,3)])});
    }else{
      const s = pick(o.s,1)[0];
      const others = pool.filter(w=>w.id!==o.id && !w.s.some(x=>norm(x)===norm(s)) && norm(w.w)!==norm(o.w) && !related(w)).map(w=>disp(w.w));
      const ans=disp(o.w);
      qs.push({id:o.id, type:"s2w", prompt:s.replace(/\*/g,""), ans, opts:shuffle([ans,...pick([...new Set(others)],3)])});
    }
  }
  return {qs, i:0, picked:null, score:0, missed:[]};
}
function quiz(){
  if(!S) S=startQuiz();
  if(S.i>=S.qs.length){
    app.innerHTML = `${top("Synonym checkpoint")}<div class="done"><div class="big num">${S.score}/${S.qs.length}</div>
      <p>${S.missed.length?"Review these words:":"Perfect round."}</p>
      ${S.missed.length?`<div class="entries missed">${[...new Set(S.missed)].map(id=>entryHTML(BY[id],true)).join("")}</div>`:""}
      <div class="row"><button class="btn pri" data-a="quiz-again">New round</button><button class="btn" data-a="home">Home</button></div></div>`;
    return;
  }
  const q=S.qs[S.i], o=BY[q.id], answered=S.picked!==null;
  app.innerHTML = `${top("Synonym checkpoint")}
  <div class="prog"><span class="num">${S.i+1}/${S.qs.length}</span><span class="bar"><i class="f" style="width:${S.i/S.qs.length*100}%"></i></span><span class="num">${S.score} right</span></div>
  <div><p class="label">${q.type==="w2s"?"Closest synonym of":"Which headword has this synonym?"}</p><p class="q">${esc(q.prompt)}</p></div>
  <div class="opts">${q.opts.map((t,k)=>{
      let cls=""; if(answered){ if(t===q.ans) cls="right"; else if(t===S.picked) cls="wrong"; }
      return `<button class="opt ${cls}" data-o="${k}" ${answered?"disabled":""}><span class="k">${"ABCD"[k]}</span>${esc(t.replace(/\*/g,""))}</button>`;}).join("")}</div>
  ${answered?`<article class="icard flip"><div class="meta"><span>List ${o.l} · word ${o.n}</span></div><h2 class="head" style="font-size:1.9rem"><mark>${esc(disp(o.w))}</mark></h2>${cardBack(o)}</article>
  <button class="btn pri" data-a="quiz-next">${S.i+1<S.qs.length?"Next question":"See score"}</button>`:""}`;
}

/* Recall */
function startRecall(){ return {q:shuffle(scope()).map(o=>o.id), i:0, got:[], extra:[], shown:false, tally:{hit:0,total:0}}; }
function recall(){
  if(!S) S=startRecall();
  if(S.i>=S.q.length){ go("home"); return; }
  const o=BY[S.q[S.i]];
  const keys=o.s.map(norm);
  const chips = o.s.map((s,k)=>{
    const hit=S.got.includes(keys[k]);
    if(S.shown) return `<span class="chip ${hit?"hit":"miss"}">${esc(s)}</span>`;
    return hit?`<span class="chip hit">${esc(s)}</span>`:"";
  }).join("") + S.extra.map(e=>`<span class="chip extra" title="Not on this word's list in the book">${esc(e)}</span>`).join("");
  const pct = S.tally.total? Math.round(S.tally.hit/S.tally.total*100):null;
  app.innerHTML = `${top("Recall the synonyms")}
  <div class="prog"><span class="num">${S.i+1}/${S.q.length}</span><span class="bar"><i class="f" style="width:${S.i/S.q.length*100}%"></i></span>${pct!==null?`<span class="num">${pct}% recalled</span>`:""}</div>
  <article class="icard">
    <div class="meta"><span>List ${o.l} · word ${o.n}</span><span class="num">${S.got.length}/${o.s.length} found</span></div>
    <h2 class="head"><mark>${esc(disp(o.w))}</mark></h2>
    ${S.shown?cardBack(o, chips):`<ul class="defs">${o.d.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>${chips?`<div class="syns">${chips}</div>`:""}`}
  </article>
  ${S.shown?`<p class="note">Green: you got it. Dashed: you missed it.${S.extra.length?" Red: not on this word's list in the book (it may still be a valid synonym).":""}</p>
     <button class="btn pri" data-a="recall-next">Next word</button>`
   :`<form class="field" id="rf" autocomplete="off"><input id="ri" placeholder="Type a synonym, press Enter" aria-label="Synonym" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn pri" type="submit">Add</button></form>
     <button class="btn" data-a="recall-show">Show all ${o.s.length} synonyms</button>`}`;
  const inp=document.getElementById("ri"); if(inp) inp.focus({preventScroll:true});
}

/* Browse */
function entryHTML(o, open){
  const st=status(o.id);
  return `<details class="entry"${open?" open":""}><summary><i class="st ${st==="new"?"":st}"></i><span class="w">${esc(disp(o.w))}</span><span class="d">${esc(o.d.join("; "))}</span></summary>
   <div class="body"><span class="note">List ${o.l} · word ${o.n}</span>${cardBack(o, o.s.map(s=>`<button class="chip link" data-q="${esc(s.replace(/\*|\(.*?\)/g,"").trim())}">${esc(s)}</button>`).join(""))}</div></details>`;
}
function browse(){
  if(!S) S={q:"", f:"all"};
  const q=S.q.trim().toLowerCase();
  let words=scope();
  if(S.f!=="all") words=words.filter(o=>status(o.id)===S.f || (S.f==="learn" && status(o.id)==="weak"));
  if(q) words=words.filter(o=>o.w.toLowerCase().includes(q)||o.s.some(s=>s.toLowerCase().includes(q))||o.d.some(d=>d.toLowerCase().includes(q)));
  const headWords = q ? V.filter(o=>o.s.some(s=>norm(s)===norm(q))) : [];
  const f=(k,l)=>`<button data-f="${k}" aria-pressed="${S.f===k}">${l}</button>`;
  app.innerHTML = `${top("Word list")}
   <input class="search" id="bq" type="search" placeholder="Search words, synonyms, definitions" value="${esc(S.q)}" aria-label="Search">
   <div class="seg">${f("all","All")}${f("new","New")}${f("learn","Learning")}${f("master","Mastered")}${f("weak","Weak")}</div>
   ${headWords.length?`<p class="note">“${esc(q)}” is a listed synonym of: ${headWords.map(o=>`<b>${esc(disp(o.w))}</b> (L${o.l})`).join(", ")}</p>`:""}
   <p class="label">${words.length} word${words.length===1?"":"s"} · ${ui.list?"List "+ui.list:"all lists"}</p>
   ${words.length?`<div class="entries">${words.map(o=>entryHTML(o,false)).join("")}</div>`:`<p class="empty">No words match.</p>`}`;
  const el=document.getElementById("bq"); if(S.focus){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

/* ---------- events ---------- */
app.addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.list!==undefined){ ui.list=+t.dataset.list; saveLocal(); render(); return; }
  if(t.dataset.g!==undefined){ const id=S.q[S.i]; const g=+t.dataset.g; grade(id,g); if(g===0) S.q.push(id); S.i++; S.done++; S.shown=false; render(); return; }
  if(t.dataset.o!==undefined && view==="quiz"){ const q=S.qs[S.i]; S.picked=q.opts[+t.dataset.o]; const ok=S.picked===q.ans; if(ok) S.score++; else S.missed.push(q.id); quizMark(q.id, ok); render(); return; }
  if(t.dataset.f){ S.f=t.dataset.f; S.focus=false; render(); return; }
  if(t.dataset.q){ S.q=t.dataset.q; S.f="all"; S.focus=false; render(); window.scrollTo(0,0); return; }
  const a=t.dataset.a; if(!a) return;
  if(a==="home") go("home");
  else if(a==="flash"||a==="flash-again") go("flash");
  else if(a==="quiz"||a==="quiz-again") go("quiz");
  else if(a==="recall") go("recall");
  else if(a==="browse") go("browse");
  else if(a==="bk-copy"){ const ta=document.getElementById("bk-out"); const m=document.getElementById("bk-msg");
    (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>{m.textContent="Code copied.";},()=>{ta.select();m.textContent="Code selected. Copy it with your device's copy command.";}); }
  else if(a==="bk-load"){ const m=document.getElementById("bk-msg"); try{ const j=JSON.parse(decodeURIComponent(escape(atob(document.getElementById("bk-in").value.trim())))); if(!j||typeof j!=="object") throw 0; merge(j); save(); render(); }catch(err){ m.textContent="That code could not be read. Copy the whole code and try again."; } }
  else if(a==="show"){ S.shown=true; render(); }
  else if(a==="quiz-next"){ S.i++; S.picked=null; render(); window.scrollTo(0,0); }
  else if(a==="recall-show"){ const o=BY[S.q[S.i]]; S.shown=true; S.tally.hit+=S.got.length; S.tally.total+=o.s.length; quizMark(o.id, S.got.length>=Math.ceil(o.s.length/2)); render(); }
  else if(a==="recall-next"){ S.i++; S.got=[]; S.extra=[]; S.shown=false; render(); window.scrollTo(0,0); }
});
app.addEventListener("submit", e=>{
  if(e.target.id!=="rf") return; e.preventDefault();
  const inp=document.getElementById("ri"); const v=inp.value.trim(); if(!v) return;
  const o=BY[S.q[S.i]]; const k=norm(v); const keys=o.s.map(norm);
  if(keys.includes(k)){ if(!S.got.includes(k)) S.got.push(k); }
  else if(!S.extra.some(x=>norm(x)===k)) S.extra.push(v);
  render();
});
app.addEventListener("input", e=>{ if(e.target.id==="bq"){ S.q=e.target.value; S.focus=true; render(); } });
render();
})();
</script>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
